<!doctype html>
<html lang="en" data-root="{{root}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | ARM Docs</title>
<link rel="icon" href="{{root}}favicon.ico">
<link rel="stylesheet" href="{{root}}site.css">
<script src="{{root}}js/theme.js"></script>
<script src="{{root}}js/minisearch.js" defer></script>
<script src="{{root}}js/search-index.js" defer></script>
<script src="{{root}}js/site.js" defer></script>
</head>
<body class="docs-body">
<header class="docs-header">
	<button type="button" class="btn btn-ghost btn-icon docs-nav-toggle" data-nav-toggle aria-label="Toggle navigation" aria-expanded="false">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
	</button>
	<a class="docs-brand" href="{{root}}index.html">ARM <span>Docs</span></a>
	<div class="docs-search">
		<input type="search" class="field-control" placeholder="Search docs" aria-label="Search docs" autocomplete="off" data-search-input>
		<div class="panel panel-compact docs-search-results" data-search-results hidden></div>
	</div>
	<button type="button" class="btn btn-ghost btn-icon" data-theme-toggle aria-label="Toggle dark mode">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
	</button>
	<a class="btn btn-ghost btn-icon" href="https://github.com/{{repo}}" target="_blank" rel="noopener" aria-label="ARM on GitHub">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
	</a>
</header>
<div class="docs-shell">
	<aside class="docs-sidebar" id="docs-sidebar">
		<nav aria-label="Documentation">{{nav}}</nav>
	</aside>
	<main class="docs-main">
		<article class="docs-prose">
{{content}}
		</article>
		<footer class="docs-footer">
			<a class="btn btn-link" href="{{editUrl}}" target="_blank" rel="noopener">Edit this page on GitHub</a>
			<span>ARM {{version}} &middot; {{commit}}</span>
		</footer>
	</main>
	<aside class="docs-toc-col">{{toc}}</aside>
</div>
</body>
</html>
