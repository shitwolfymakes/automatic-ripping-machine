# Standalone ui-neu dev compose — nginx serving the static SvelteKit bundle
# and reverse-proxying /api + /ws to the v3 arm-backend over TLS. This mirrors
# the root stack's `arm-ui` (Vue) service shape; wiring ui-neu into the root
# docker-compose is a future pass.
#
# Assumes arm-backend is reachable on the shared compose network and that the
# UI's TLS leaf + the internal CA live under ./arm/certs (as produced by
# devtools/setup-dev.sh in the root stack).

services:
  arm-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armv3-ui-neu
    restart: unless-stopped
    depends_on:
      - arm-backend
    ports:
      - "8081:443"
    volumes:
      - ./arm/certs/arm-ca.crt:/etc/ssl/arm/arm-ca.crt:ro
      - ./arm/certs/arm-ui.crt:/etc/ssl/arm/tls.crt:ro
      - ./arm/certs/arm-ui.key:/etc/ssl/arm/tls.key:ro
