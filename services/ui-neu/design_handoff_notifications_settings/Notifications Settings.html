<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARM · Notifications Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Inter"', 'system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif'],
          mono: ['"JetBrains Mono"', '"SF Mono"', 'ui-monospace', 'Menlo', 'monospace'],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body, #root { height: 100%; }
  body {
    background: #0a0d18;
    font-family: 'Inter', system-ui, sans-serif;
    color: #e2e8f0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }
  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1f2540; border-radius: 5px; border: 2px solid #0a0d18; }
  ::-webkit-scrollbar-thumb:hover { background: #2d3458; }

  /* Subtle vignette + radial accent on the page background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(139, 92, 246, 0.08), transparent 60%),
      radial-gradient(700px 400px at 0% 110%, rgba(59, 130, 246, 0.06), transparent 60%);
    z-index: 0;
  }
  #root { position: relative; z-index: 1; }

  /* Disable browser's text-input password reveal in dark mode for cleaner look */
  input[type="password"]::-ms-reveal { display: none; }

  /* Smooth all transitions a touch */
  button, input, textarea, a { transition-duration: 150ms; }

  /* Helpers to render Tailwind classes via Play CDN once stylesheets are loaded */
  .fadein { animation: fadein .18s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="wizard.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
