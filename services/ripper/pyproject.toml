[project]
name = "arm_ripper"
version = "0.0.0"
description = "ARM v3 Ripper — one container per optical drive"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "discid>=1.2",
    # Reference implementation of the matrix256v1 disc fingerprint; the scan
    # feeds it a sparse skeleton of the pycdlib-enumerated tree (see
    # arm_ripper.scan.matrix256_fp).
    "matrix256>=1.0.3",
    "pydvdid-m>=1.1",
    "pycdlib",
    "websockets>=12",
    "arm_common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arm_ripper"]

[tool.hatch.build.targets.wheel.force-include]
"arm_ripper/py.typed" = "arm_ripper/py.typed"

[tool.uv.sources]
arm_common = { workspace = true }
