# Weekly rebuild — repush the latest stable release against fresh
# base layers so users pinned to the supported stable tag get CVE-patched
# bits without us hand-cutting a new release every time Debian/Python ships
# a security update. (The newest stable `v3.*` tag is the SECURITY.md support
# target; `:latest` tracks main HEAD and is refreshed nightly by
# publish-main.yml, so it is intentionally NOT touched here.)
#
# Trigger: weekly cron (Sundays 03:17 UTC — off-peak, off-hour to dodge
# Docker Hub rate-limit windows). Also `workflow_dispatch` for manual rerun.
#
# Strategy:
#   1. Find the most recent stable `v3.*` tag (excludes pre-releases like -alpha-1).
#   2. Check that tag out.
#   3. Rebuild every service image (and each arm-transcode variant target,
#      tagged <tag>-intel / <tag>-amd) from scratch (no Docker layer cache:
#      that's the whole point, pull fresh base + apt indices).
#   4. Push to the SAME tag only.
#   5. Re-sign + re-attest SBOM. Sigstore accepts multiple sigs per image.
#
# If no stable v3.* tag exists yet, the workflow no-ops cleanly.
name: Weekly rebuild

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override: rebuild this exact tag instead of latest stable'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: resolve target tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      skip: ${{ steps.find.outputs.skip }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve target tag
        id: find
        env:
          OVERRIDE: ${{ inputs.tag }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            tag="$OVERRIDE"
          else
            # Newest stable v3 tag (no pre-release suffix).
            tag="$(git tag --list 'v3.*' --sort=-v:refname | grep -v -- '-' | head -n1 || true)"
          fi
          if [[ -z "$tag" ]]; then
            echo "::warning::No stable v3.* tag found — nothing to rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Resolved target tag: $tag"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  rebuild:
    name: rebuild (${{ matrix.service }}${{ matrix.suffix }})
    needs: resolve-tag
    if: needs.resolve-tag.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same legs as release.yml: `target` picks a Dockerfile stage (empty:
        # the file's last stage), `suffix` is appended to the tag, so the
        # transcode variants :<tag>-intel / :<tag>-amd are refreshed too.
        # `dir` (default: the service name) is the services/ subdirectory
        # holding the Dockerfile; the arm-ui image is built from ui-neu.
        include:
          - {service: backend, target: "", suffix: ""}
          - {service: ripper, target: "", suffix: ""}
          - {service: transcode, target: base, suffix: ""}
          - {service: transcode, target: intel, suffix: "-intel"}
          - {service: transcode, target: amd, suffix: "-amd"}
          - {service: ui, dir: ui-neu, target: "", suffix: ""}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      # A stable tag cut before the Vue UI was removed still has
      # services/ui/, and its arm-ui image is that Vue build; rebuild it from
      # there so the tag keeps shipping what it was released with. Later tags
      # have no services/ui/ and build the leg's `dir` (services/ui-neu/).
      #
      # A stable tag cut before the transcode Dockerfile was split into
      # targets has no such stages. Its base leg then builds the file's last
      # stage (that tag's only runtime image); its variant legs have no image
      # to refresh and are skipped instead of failing. An empty target always
      # builds the last stage.
      - name: Resolve the Dockerfile and target at this tag
        id: target
        env:
          TARGET: ${{ matrix.target }}
          SERVICE: ${{ matrix.service }}
          DIR: ${{ matrix.dir }}
        run: |
          DOCKERFILE="services/${SERVICE}/Dockerfile"
          if [[ -n "$DIR" && ! -f "$DOCKERFILE" ]]; then
            DOCKERFILE="services/${DIR}/Dockerfile"
          elif [[ -n "$DIR" ]]; then
            echo "::notice::this tag predates services/${DIR}/ as arm-${SERVICE}; building $DOCKERFILE"
          fi
          echo "file=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          if [[ -z "$TARGET" ]] || grep -qiE "^FROM .+ AS ${TARGET}\$" "$DOCKERFILE"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          elif [[ "$TARGET" == "base" ]]; then
            echo "::notice::$DOCKERFILE at this tag has no 'base' stage; building its last stage"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$DOCKERFILE at this tag has no '$TARGET' stage; skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.target.outputs.build == 'true'

      - name: Verify required repo configuration
        if: steps.target.outputs.build == 'true'
        env:
          NS: ${{ secrets.DOCKERHUB_NAMESPACE }}
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOK: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=()
          [[ -z "$NS"   ]] && missing+=("secrets.DOCKERHUB_NAMESPACE")
          [[ -z "$USER" ]] && missing+=("secrets.DOCKERHUB_USERNAME")
          [[ -z "$TOK"  ]] && missing+=("secrets.DOCKERHUB_TOKEN")
          if (( ${#missing[@]} )); then
            printf '::error::Missing repo configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.target.outputs.build == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        if: steps.target.outputs.build == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: docker.io/${{ secrets.DOCKERHUB_NAMESPACE }}/arm-${{ matrix.service }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.resolve-tag.outputs.tag }}

      # Crucially: NO cache-from. Weekly rebuild's whole job is to ignore
      # the cache and pull fresh base layers + apt indices.
      - name: Build & push (no cache)
        id: build
        if: steps.target.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ steps.target.outputs.file }}
          target: ${{ steps.target.outputs.target }}
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: false
          # Optional MakeMKV mirror (ripper build; ignored by the others).
          build-args: |
            MAKEMKV_MIRROR_URL=${{ vars.MAKEMKV_MIRROR_URL }}
          secrets: |
            makemkv_mirror_password=${{ secrets.MAKEMKV_MIRROR_PASSWORD }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        if: steps.target.outputs.build == 'true'
        with:
          cosign-release: 'v2.4.1'

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: steps.target.outputs.build == 'true'
        with:
          image: docker.io/${{ secrets.DOCKERHUB_NAMESPACE }}/arm-${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: /tmp/sbom-${{ matrix.service }}${{ matrix.suffix }}.spdx.json
          upload-artifact: false

      - name: Sign image (cosign keyless)
        if: steps.target.outputs.build == 'true'
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: docker.io/${{ secrets.DOCKERHUB_NAMESPACE }}/arm-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest SBOM (cosign keyless)
        if: steps.target.outputs.build == 'true'
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE: docker.io/${{ secrets.DOCKERHUB_NAMESPACE }}/arm-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate /tmp/sbom-${{ matrix.service }}${{ matrix.suffix }}.spdx.json \
            --type spdxjson \
            "$IMAGE"
