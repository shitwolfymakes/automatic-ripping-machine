name: Publish ARM Wiki Update

# Publishes docs/user from main only. A review-time trigger synced an unmerged
# PR's docs to the public wiki (the sync is rsync --delete, so the wiki mirrors
# whatever it is given).
#
# Opt-in per repository, like the docs site: it runs only when the repo
# variable WIKI_SYNC_ENABLED is 'true'. A repository whose wiki still serves
# other docs (the v2 wiki) is never overwritten by these until it opts in.
on:
  push:
    branches: [main]
    paths:
      - docs/user/**
  workflow_dispatch:

env:
  GIT_AUTHOR_NAME: Actionbot
  GIT_AUTHOR_EMAIL: actions@github.com

permissions:
  contents: write

jobs:
  job-sync-docs-to-wiki:
    runs-on: ubuntu-latest
    # A manual run can be started on any branch; only main's docs are published.
    if: vars.WIKI_SYNC_ENABLED == 'true' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Sync arm docs to wiki
        # Archived upstream; v1.0.1 is the last release (main only adds release-config commits).
        uses: newrelic/wiki-sync-action@dbf2a9603687e77ad8b5be714fa6dd055183508b # v1.0.1
        with:
          source: docs/user
          destination: wiki
          token: ${{ secrets.ARM_WIKI_TOKEN }}
          gitAuthorName: ${{ env.GIT_AUTHOR_NAME }}
          gitAuthorEmail: ${{ env.GIT_AUTHOR_EMAIL }}