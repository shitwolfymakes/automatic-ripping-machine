# Pre-commit hooks for ARM.
#
# Install once:  uv run pre-commit install
# Run manually:  uv run pre-commit run --all-files
# Bump pins:     uv run pre-commit autoupdate

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  # mypy runs as a local hook against the uv-synced venv so it sees the real
  # workspace dependencies (fastapi, sqlmodel, pydantic, …) instead of a pinned
  # subset maintained in additional_dependencies.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        args:
          - --config-file=pyproject.toml
          - -p
          - arm_common
          - -p
          - arm_backend
          - -p
          - arm_ripper
          - -p
          - arm_transcode
        types: [python]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        files: \.sh$
